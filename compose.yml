services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: bahla
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # ========================================================
      # Spring Boot environment
      # ========================================================

      SPRING_PROFILES_ACTIVE: dev

      # ========================================================
      # MySQL — Docker internal connection
      # ========================================================

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bahla
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # ========================================================
      # JWT authentication
      # ========================================================

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      # ========================================================
      # Redis
      # ========================================================

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # ========================================================
      # Cloudinary
      # ========================================================

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # ========================================================
      # Mailpit SMTP
      # ========================================================

      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025

      # ========================================================
      # Agora frontend
      # ========================================================

      APP_FRONTEND_URL: http://localhost:3000

      # ========================================================
      # Toss Payments
      # ========================================================

      # Server-side secret key.
      # Never expose this key in Next.js client components.
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?TOSS_SECRET_KEY must be configured}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      mailpit:
        condition: service_started

volumes:
  mysql_data:
  redis_data: